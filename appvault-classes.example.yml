# appvault-classes.yml -- config for class-scoped string obfuscation.
#
# RECOMMENDED: name the folders ("packages") that hold your secret-bearing code;
# EVERY class inside them is obfuscated. Used with the in-place build hook
# (Scripts/appvault-inplace.sh), your source files are obfuscated only during the build and restored
# afterwards -- no files move, nothing is committed in obfuscated form, the working tree is unchanged.
packages:
  - MyApp/Secure          # folder(s) whose classes should be obfuscated

# -------------------------------------------------------------------------------------------------
# ALTERNATIVE: finer-grained control. Pick exact classes, and/or use the "mirror" build model
# (Scripts/appvault-build-phase.sh), which compiles a transformed copy and keeps originals out of
# the target. `sources` + `classes` (+ `output` for mirror mode):
#
# sources:
#   - MyApp/Protected     # folder(s) or file(s) to read
# classes:
#   - ApiClient
#   - LoginManager
#   # - "*"               # or every class found
# output: Generated       # (mirror mode only) a folder the target DOES compile
